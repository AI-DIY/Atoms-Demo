# Dedicated instance. Dufs retains its Docker listener on 443.
user nginx;
worker_processes 1;
pid /run/agent-studio-nginx.pid;
error_log /var/log/nginx/agent-studio-error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/agent-studio-access.log;
    sendfile on;
    keepalive_timeout 65;
    include /opt/agent-studio/current/deploy/nginx-agent-studio.conf;
}
